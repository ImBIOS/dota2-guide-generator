name: daily-guides

on:
  schedule:
    - cron: "0 2 * * *" # daily 02:00 UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-guides
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run generate:bh
        env:
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}
      - name: Commit artifacts
        run: |
          git config user.name "guide-bot"
          git config user.email "guide-bot@users.noreply.github.com"
          git add guides/ builds/
          git diff --cached --quiet || git commit -m "daily guides: $(date -u +%F)"
          git push
